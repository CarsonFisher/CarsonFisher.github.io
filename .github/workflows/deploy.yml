name: Build and Deploy Hugo Site to GitHub Pages
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build site
        run: hugo --source landing/site --destination public --gc --minify

      - name: Deploy to GitHub Pages
        run: |
          rsync -av --delete public/ . --exclude .git --exclude .github
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: Deploy Hugo site to GitHub Pages [skip ci]" || echo "No changes to commit"
          git push